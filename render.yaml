services:
  - type: web
    name: foodbridge-server
    env: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://YOUR_CLIENT.onrender.com

  - type: static
    name: foodbridge-client
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE
        value: https://YOUR_SERVER.onrender.com

openapi: 3.0.3
info:
  title: FoodBridge API
  version: 0.1.0
paths:
  /api/health:
    get:
      responses:
        '200': { description: OK }
  /api/cookbook:
    get:
      responses:
        '200':
          description: Cookbook list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, title, ingredients, steps]
                      properties:
                        id: { type: string }
                        title: { type: string }
                        tags: { type: array, items: { type: string } }
                        ingredients:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              qty: { type: string }
                        steps:
                          type: array
                          items: { type: string }
  /api/cart:
    get:
      responses: { '200': { description: Cart } }
  /api/cart/add:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                qty: { type: integer }
      responses: { '200': { description: Cart updated } }
  /api/cart/clear:
    post:
      responses: { '200': { description: Cart cleared } }
